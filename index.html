<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>Shadow Chronicles</title>
    <meta name="description" content="Roguelike d'action dark fantasy : survivez aux vagues de la Brume." />
    <meta name="theme-color" content="#07111f" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shadow Chronicles" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07111f; overscroll-behavior: none;
        touch-action: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      #app { position: fixed; inset: 0; }
      #loading { position: fixed; inset: 0; z-index: 100; background: #07111f; transition: opacity .3s; display: grid; place-content: center; gap: 14px; color: #f1e5ca;
        font: 600 20px Georgia, serif; text-align: center; letter-spacing: 1px; }
      #loading .track { width: 260px; height: 6px; border: 1px solid #937444; border-radius: 4px; overflow: hidden; }
      #loading-bar { width: 0; height: 100%; background: linear-gradient(90deg, #937444, #d5b77e); transition: width .15s; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">Shadow Chronicles<div class="track"><div id="loading-bar"></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
